# /etc/nginx/sites-available/coach (symlink to sites-enabled)
# Replace example.com with your domain. Let's Encrypt handles certbot config.

# --- Rate limit zone: slows brute-force on /api/login etc. ---
limit_req_zone $binary_remote_addr zone=coach_api:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=coach_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name coach.example.com;
    # Let certbot handle the upgrade; ACME challenge lives at /.well-known/acme-challenge/
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name coach.example.com;

    # --- TLS (filled in by certbot) ---
    ssl_certificate     /etc/letsencrypt/live/coach.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/coach.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS (set only after you're sure cert is permanent).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Belt-and-suspenders: backend already sets these; nginx mirrors a subset.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 10s;
    send_timeout 15s;

    limit_conn coach_conn 20;

    # Static assets — let Go serve, but we can cache aggressively in nginx if desired.
    location /static/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API — rate-limited.
    location /api/ {
        limit_req zone=coach_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Everything else (SPA shell).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================
# Coach Adaptatif — docker-compose
# =============================================================
# Usage minimal (sans reverse proxy, accès HTTP direct) :
#   1. cp .env.example .env
#   2. Éditer .env (au minimum COACH_TOKEN_KEY ; COACH_PORT optionnel)
#   3. docker compose up -d
#   4. Ouvrir http://<ip-du-host>:8080 (ou le port choisi)
#
# Premier lancement : ajouter aussi COACH_ADMIN_EMAIL et COACH_ADMIN_PASSWORD
# dans .env. Les retirer après que l'admin soit créé (sinon le mot de passe
# est réécrit à chaque restart).
#
# Note TLS : l'app sert du HTTP. Pour exposer publiquement avec HTTPS,
# voir le bloc « reverse proxy (optionnel) » plus bas ou utiliser un
# tunnel (Cloudflare Tunnel, Tailscale Funnel, etc.). Pour un usage local
# ou sur LAN/VPN privé, HTTP direct suffit.
# =============================================================

services:
  coach-app:
    build: .
    image: coach-app:latest
    # Force le build local. Sans ça, compose tente un `docker pull
    # coach-app:latest` avant de tomber sur le build → ligne de warning
    # "pull access denied" cosmétique mais déroutante.
    pull_policy: build
    container_name: coach-app
    restart: unless-stopped
    ports:
      # Bind direct sur toutes les interfaces du host. Port host configurable
      # via COACH_PORT dans .env (défaut 8080). Pour restreindre à localhost
      # (ex. derrière un reverse proxy local), préfixer par 127.0.0.1: dans .env :
      #   COACH_PORT=127.0.0.1:8080
      - "${COACH_PORT:-8080}:8080"
    volumes:
      - coach_data:/data
    environment:
      # Variables critiques — toutes définies dans .env
      COACH_LISTEN:               0.0.0.0:8080
      COACH_DATA:                 /data
      COACH_PUBLIC:               /app/public
      # DSN MariaDB. Le service `db` ci-dessous l'héberge ; le mot de passe
      # vient de .env (DB_PASSWORD). Utilisée par l'app au runtime ET par les
      # sous-commandes one-shot `--import` / `--verify`.
      COACH_DB:                   "coach:${DB_PASSWORD:?missing in .env}@tcp(db:3306)/coach?parseTime=true&charset=utf8mb4&loc=UTC"
      # Pas de reverse proxy par défaut → on ne fait pas confiance aux
      # X-Forwarded-*. Passer à 1 uniquement si tu mets nginx/Caddy devant.
      COACH_TRUST_PROXY:          ${COACH_TRUST_PROXY:-0}
      COACH_ALLOW_REGISTRATION:   ${COACH_ALLOW_REGISTRATION:-0}
      COACH_2FA_REQUIRED:         ${COACH_2FA_REQUIRED:-1}
      COACH_TOKEN_KEY:            "${COACH_TOKEN_KEY:?missing in .env, generate with: openssl rand -hex 32}"
      COACH_ADMIN_EMAIL:          ${COACH_ADMIN_EMAIL:-}
      COACH_ADMIN_PASSWORD:       ${COACH_ADMIN_PASSWORD:-}
      # Intégration Strava — vides = bouton "Se connecter" désactivé.
      # Voir INTEGRATIONS.md pour le walkthrough complet (créer l'app,
      # set les vars, souscrire le webhook).
      STRAVA_CLIENT_ID:           ${STRAVA_CLIENT_ID:-}
      STRAVA_CLIENT_SECRET:       ${STRAVA_CLIENT_SECRET:-}
      STRAVA_VERIFY_TOKEN:        ${STRAVA_VERIFY_TOKEN:-}
      STRAVA_WEBHOOK_URL:         ${STRAVA_WEBHOOK_URL:-}
      STRAVA_REDIRECT_URI:        ${STRAVA_REDIRECT_URI:-}
    healthcheck:
      # Le binaire lui-même implémente --healthcheck : hit interne sur
      # /privacy via 127.0.0.1, exit 0/1. Pas besoin de curl/wget dans
      # l'image distroless. La directive HEALTHCHECK du Dockerfile fait
      # déjà le job, on duplique ici pour overriding éventuel.
      test: ["CMD", "/app/coach-app", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    # Sécurité runtime
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Limites de ressources (ajuster selon la charge)
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
    # Logs : driver json-file avec rotation pour éviter de saturer le disque
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    # Attend que MariaDB soit saine avant de démarrer (et avant un --import).
    depends_on:
      db:
        condition: service_healthy

  # =============================================================
  # Base de données MariaDB
  # =============================================================
  # Démarre VIERGE au premier `up` ; les tables sont créées par la
  # sous-commande `--import` du binaire (CREATE TABLE IF NOT EXISTS). Les
  # données sont persistées par le volume nommé `db_data`. Pas de `ports:`
  # exposé → joignable uniquement depuis le réseau interne du compose.
  db:
    # Épinglée par tag précis + digest (immuable — même posture supply-chain
    # que le Dockerfile). Digest relevé le 2026-07-09. Mise à jour : changer
    # le tag ET le digest ensemble, puis `docker compose up -d`.
    image: mariadb:12.3.2@sha256:628f228f0fd5913a220438693576b29b6fe4dc1fa0a1298c0e98579fae28635f
    restart: unless-stopped
    # Réglages adaptés à une instance self-hosted à faible concurrence :
    # l'app n'ouvre qu'un pool → 50 connexions suffisent largement ;
    # performance_schema OFF économise ~100 Mo de RAM ; buffer pool 128 Mo
    # couvre des années d'historique multi-users (augmenter si la base
    # dépasse ~1 Go).
    command:
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
      - --skip-name-resolve
    environment:
      MARIADB_DATABASE:      coach
      MARIADB_USER:          coach
      MARIADB_PASSWORD:      "${DB_PASSWORD:?missing in .env}"
      MARIADB_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?missing in .env}"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    # Borne la RAM totale de la stack : sans limite, MariaDB peut consommer
    # bien au-delà du buffer pool sous charge.
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  # =============================================================
  # Backups automatiques MariaDB (dump quotidien + rétention)
  # =============================================================
  # Dump `mariadb-dump --single-transaction` chaque nuit à BACKUP_HOUR UTC
  # (défaut 03h), rétention 7 quotidiens + 4 hebdomadaires, checksum sha256,
  # chiffrement optionnel (BACKUP_PASSPHRASE dans .env). Joint aussi une
  # archive des journaux d'audit (volume coach_data, monté en lecture seule).
  #
  #   Dump manuel immédiat : docker compose run --rm db-backup once
  #   Restauration         : voir BACKUPS.md (arrêter coach-app d'abord !)
  #
  # ⚠️ Les dumps restent SUR LA MÊME MACHINE (volume db_backups). Pour une
  # vraie résilience, synchroniser ce volume vers un stockage externe
  # (rclone/restic/rsync) — exemple dans BACKUPS.md.
  db-backup:
    image: mariadb:12.3.2@sha256:628f228f0fd5913a220438693576b29b6fe4dc1fa0a1298c0e98579fae28635f
    restart: unless-stopped
    entrypoint: ["bash", "/scripts/db-backup.sh"]
    command: ["daemon"]
    environment:
      DB_HOST:           db
      DB_NAME:           coach
      DB_USER:           coach
      DB_PASSWORD:       "${DB_PASSWORD:?missing in .env}"
      BACKUP_HOUR:       ${BACKUP_HOUR:-03}
      RETENTION_DAILY:   ${RETENTION_DAILY:-7}
      RETENTION_WEEKLY:  ${RETENTION_WEEKLY:-4}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE:-}
    volumes:
      - ./scripts/db-backup.sh:/scripts/db-backup.sh:ro
      - db_backups:/backups
      - coach_data:/coach-data:ro
    healthcheck:
      # Rouge si le dernier dump réussi date de plus de 26 h.
      test: ["CMD", "bash", "/scripts/db-backup.sh", "check"]
      interval: 5m
      timeout: 10s
      retries: 3
      start_period: 2m
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
    depends_on:
      db:
        condition: service_healthy

volumes:
  coach_data:
    # Volume nommé géré par Docker. Pour un bind mount sur le host, remplacer par :
    #   coach_data:
    #     driver: local
    #     driver_opts:
    #       type: none
    #       o: bind
    #       device: /var/lib/coach-app/data
  db_data:
    # Persiste la base MariaDB. NE PAS supprimer (`down -v`) tant que la
    # migration n'est pas validée — sinon la base repart vierge.
  db_backups:
    # Dumps quotidiens du service db-backup. Pour les écrire directement
    # sur un chemin du host (plus simple à synchroniser hors-machine) :
    #   db_backups:
    #     driver: local
    #     driver_opts:
    #       type: none
    #       o: bind
    #       device: /var/lib/coach-app/backups

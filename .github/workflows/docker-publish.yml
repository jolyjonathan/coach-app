name: Publish Docker image (GHCR)

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

# Une seule publication à la fois pour éviter les races sur le tag :latest.
concurrency:
  group: ghcr-publish
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write
  # Pour la signature cosign keyless (OIDC) — peut rester sans effet si
  # cosign n'est pas configuré côté consommateur.
  id-token: write
  attestations: write

jobs:
  publish:
    name: Build & push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # - main → :main + :sha-abcdef
          # - tag v1.2.3 → :1.2.3 + :1.2 + :1 + :latest
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=Coach Adaptatif
            org.opencontainers.image.description=Self-hosted adaptive strength training app
            org.opencontainers.image.licenses=MIT

      - name: Build & push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Generate build attestation
        # Atteste de la provenance de l'image (lien vers le commit qui l'a
        # produite). Vérifiable avec `gh attestation verify`.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

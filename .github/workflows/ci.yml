name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche/PR : économise des minutes
# CI quand on push plusieurs fois d'affilée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Lint + tests Go
  # -----------------------------------------------------------
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod / go.sum sont sales. Lance 'go mod tidy' localement."
            git diff go.mod go.sum
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés (lance 'gofmt -w .') :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: go build
        run: |
          CGO_ENABLED=0 GOOS=linux \
            go build -trimpath -ldflags="-s -w" -o /tmp/coach-app .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # -----------------------------------------------------------
  # Build de l'image Docker (sans push) — vérifie que le Dockerfile
  # reste fonctionnel à chaque PR.
  # -----------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: go
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: coach-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          # Le binaire répond à --healthcheck quand un serveur tourne.
          # Pour le CI, on vérifie juste que l'image est bien formée et
          # que l'entrypoint est exécutable.
          docker run --rm --entrypoint /app/coach-app coach-app:ci --help 2>&1 | head -20 || true
          docker image inspect coach-app:ci > /dev/null

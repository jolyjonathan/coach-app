name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Annule les runs précédents sur la même branche/PR : économise des minutes
# CI quand on push plusieurs fois d'affilée.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------
  # Lint + tests Go
  # -----------------------------------------------------------
  go:
    name: Go build & test
    runs-on: ubuntu-latest
    # Backend MariaDB obligatoire : la suite de tests s'exécute contre une vraie
    # base éphémère (TRUNCATE entre chaque test, cf. testhelpers_test.go).
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: coach_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Verify go.mod tidy
        run: |
          go mod tidy
          if ! git diff --quiet go.mod go.sum; then
            echo "::error::go.mod / go.sum sont sales. Lance 'go mod tidy' localement."
            git diff go.mod go.sum
            exit 1
          fi

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::Fichiers non formatés (lance 'gofmt -w .') :"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        env:
          COACH_DB: "root:root@tcp(127.0.0.1:3306)/coach_test?parseTime=true&loc=UTC&charset=utf8mb4"
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: go build
        run: |
          CGO_ENABLED=0 GOOS=linux \
            go build -trimpath -ldflags="-s -w" -o /tmp/coach-app .

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # -----------------------------------------------------------
  # Tests JS des modèles scientifiques (banister, bayesian, science,
  # programming, rehab, snacks). 83 assertions, zéro dépendance npm —
  # juste node. Sans ce job, une régression dans les modèles passait
  # la CI sans être vue (les tests Go ne couvrent que le backend).
  # -----------------------------------------------------------
  js:
    name: JS model tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run model tests
        working-directory: public
        run: node tests/run-tests.js

      - name: Syntax-check tous les JS servis
        working-directory: public
        run: |
          for f in *.js; do
            node --check "$f"
          done

  # -----------------------------------------------------------
  # Tests end-to-end Playwright — parcours navigateur réel (login,
  # consentement, onboarding, nav, chargement des assets). Build le
  # binaire Go et le lance via le webServer Playwright.
  # -----------------------------------------------------------
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [go, js]
    # Le binaire lancé par Playwright requiert MariaDB (COACH_DB). La config
    # webServer (e2e/playwright.config.js) pointe par défaut sur coach_e2e.
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: coach_e2e
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + browser
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: e2e
        run: npx playwright test --config playwright.config.js

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7

  # -----------------------------------------------------------
  # Build de l'image Docker (sans push) — vérifie que le Dockerfile
  # reste fonctionnel à chaque PR.
  # -----------------------------------------------------------
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [go, js]
    # Le conteneur smoke-testé requiert MariaDB (COACH_DB obligatoire au boot).
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_DATABASE: coach
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: coach-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          # VRAI smoke test : on démarre le conteneur comme en production
          # (clé de chiffrement valide requise depuis le fail-fast au boot),
          # on attend que /healthz réponde 200 depuis le host, puis on
          # vérifie aussi le sub-mode --healthcheck (celui que Docker
          # HEALTHCHECK utilise). Aucun `|| true` : tout échec est bloquant.
          set -euo pipefail
          # --network host : le conteneur partage le réseau du runner pour
          # joindre le service MariaDB publié sur 127.0.0.1:3306. Du coup pas
          # de -p : l'app écoute directement sur le port 8080 du host.
          docker run -d --name coach-smoke --network host \
            -e COACH_TOKEN_KEY="$(openssl rand -hex 32)" \
            -e COACH_LISTEN=127.0.0.1:8080 \
            -e COACH_DB="root:root@tcp(127.0.0.1:3306)/coach?parseTime=true&loc=UTC&charset=utf8mb4" \
            coach-app:ci

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1; then
              ok=1; break
            fi
            sleep 1
          done

          echo "--- logs conteneur ---"
          docker logs coach-smoke

          if [ "$ok" != "1" ]; then
            echo "::error::/healthz n'a jamais répondu 200 en 30s"
            docker rm -f coach-smoke
            exit 1
          fi

          # Le sub-mode --healthcheck (utilisé par HEALTHCHECK du Dockerfile)
          # doit sortir en 0 quand le serveur tourne.
          docker exec coach-smoke /app/coach-app --healthcheck

          # La page d'accueil et la policy doivent répondre aussi.
          curl -fsS http://127.0.0.1:8080/ >/dev/null
          curl -fsS http://127.0.0.1:8080/privacy >/dev/null

          docker rm -f coach-smoke
          echo "Smoke test OK"

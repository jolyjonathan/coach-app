# =============================================================
# CI/CD coach-app — à copier dans coach-app/.github/workflows/release.yml
# =============================================================
# Flux de déploiement :
#   push main        → tests + build + scan → GHCR sha-<commit> → tag STAGING mis à jour dans jjoly-infra
#   tag git vX.Y.Z   → idem → tag PROD mis à jour dans jjoly-infra
# Flux applique ensuite tout seul (~1 min). Rollback = git revert dans jjoly-infra.
#
# Prérequis :
#   - secret INFRA_REPO_TOKEN : PAT fine-grained, permission Contents:write sur jolyjonathan/jjoly-infra
#   - remplacer jolyjonathan partout
name: release

concurrency:
  group: deploy-infra-coach
  cancel-in-progress: false

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]

env:
  IMAGE: ghcr.io/jolyjonathan/coach-app

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    # MariaDB obligatoire, comme dans ci.yml.
    #
    # Sans ce service, TestMain (testhelpers_test.go) sort immédiatement faute
    # de COACH_DB : `go test ./...` affiche « ok » et rend 0 sans avoir exécuté
    # un seul test. Le job passait donc au vert quoi qu'il arrive, et
    # build-push s'exécutait derrière un garde-fou qui ne gardait rien — une
    # image pouvait être publiée en production sans qu'aucun test ait tourné.
    services:
      mariadb:
        image: mariadb:12.3.2@sha256:628f228f0fd5913a220438693576b29b6fe4dc1fa0a1298c0e98579fae28635f
        env:
          MARIADB_DATABASE: coach_test
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - run: go vet ./...

      # Garde-fou contre la régression silencieuse : si TestMain se remettait à
      # sortir sans rien exécuter, le compte de tests tomberait à zéro et ce
      # pas échouerait, au lieu de laisser passer un « ok » trompeur.
      - name: Vérifier que les tests s'exécutent réellement
        env:
          COACH_DB: "root:root@tcp(127.0.0.1:3306)/coach_test?parseTime=true&loc=UTC&charset=utf8mb4"
        run: |
          go test -v ./... 2>&1 | tee /tmp/sortie.txt
          n=$(grep -c '^--- PASS' /tmp/sortie.txt || true)
          echo "$n test(s) exécuté(s)"
          if [ "$n" -lt 20 ]; then
            echo "::error::Seulement $n test(s) exécuté(s) — la suite ne tourne pas vraiment."
            exit 1
          fi

  build-push:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - id: meta
        name: Déterminer le tag d'image
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

      - name: Scan vulnérabilités (bloquant sur CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
          exit-code: "1"
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout jjoly-infra
        uses: actions/checkout@v7
        with:
          repository: jolyjonathan/jjoly-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}

      - name: Mettre à jour le tag d'image (staging sur main, prod sur tag)
        run: |
          TAG="${{ needs.build-push.outputs.tag }}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TARGET=apps/coach/prod/kustomization.yaml
          else
            TARGET=apps/coach/staging/kustomization.yaml
          fi
          git config user.name  "ci-bot"
          git config user.email "ci@jjoly.eu"

          # jjoly-infra a QUATRE écrivains : chaque dépôt d'app y pousse, et
          # `git push --follow-tags` déclenche deux runs à la fois (branche +
          # tag). Le second push arrive sur une référence qui a bougé et se
          # fait rejeter — panne intermittente, jamais reproduite au moment où
          # on la cherche.
          #
          # On réessaie en repartant de l'état courant. Sûr ici : chaque run ne
          # touche qu'un fichier de son application, deux écrivains différents
          # ne peuvent pas entrer en conflit.
          for essai in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            sed -i "/# ci-managed/s|newTag: [^ ]*|newTag: $TAG|" "$TARGET"
            if git diff --quiet -- "$TARGET"; then
              echo "$TARGET porte déjà $TAG — rien à faire."
              exit 0
            fi
            git add "$TARGET"
            git commit -m "deploy(coach): $TAG → $(basename $(dirname $TARGET))"
            if git push origin HEAD:main; then
              echo "Poussé à la tentative $essai."
              exit 0
            fi
            echo "Push rejeté (tentative $essai) — un autre run a écrit entre-temps."
            sleep $((essai * 3))
          done
          echo "::error::Cinq tentatives rejetées : l'infra est écrite en continu, ou le jeton n'a plus le droit d'écrire."
          exit 1

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Solid blue background with rounded corners (maskable-safe inner area). -->
  <rect width="512" height="512" rx="96" fill="#26408b"/>
  <!-- Simple barbell: two plates + bar, centered. The 40% safe zone for
       maskable icons is roughly the inner 410px square — our glyph sits in ~280px. -->
  <g fill="#ffffff" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- bar -->
    <rect x="120" y="246" width="272" height="20" rx="6"/>
    <!-- left plate -->
    <rect x="96" y="196" width="32" height="120" rx="10"/>
    <!-- right plate -->
    <rect x="384" y="196" width="32" height="120" rx="10"/>
    <!-- inner left collar -->
    <rect x="136" y="222" width="18" height="68" rx="6"/>
    <!-- inner right collar -->
    <rect x="358" y="222" width="18" height="68" rx="6"/>
  </g>
  <!-- Accent dot (amber brand color) for the "A" in Adaptatif -->
  <circle cx="256" cy="384" r="14" fill="#ff9e3f"/>
</svg>
